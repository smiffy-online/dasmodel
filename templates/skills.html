{% extends "base.html" %}
{% block title %}Skills - DasModel{% endblock %}

{% block head %}
<style>
  .prompt-template {
    font-family: monospace;
    font-size: 0.85rem;
    min-height: 200px;
  }
  .preview-output {
    white-space: pre-wrap;
    font-size: 0.85rem;
    background: var(--bs-tertiary-bg);
    border: 1px solid var(--bs-border-color);
    border-radius: 0.375rem;
    padding: 0.75rem;
    max-height: 400px;
    overflow-y: auto;
  }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">Skills Templates</h5>
  <button class="btn btn-sm btn-primary" id="btn-add-skill">Add skill</button>
</div>

<div id="skills-list"></div>

<!-- Add/Edit modal -->
<div class="modal fade" id="skillModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="skillModalTitle">Add skill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="skill-id">
        <div class="row mb-3">
          <div class="col-6">
            <label for="skill-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="skill-name" placeholder="e.g. system_skill">
          </div>
          <div class="col-6">
            <label for="skill-desc" class="form-label">Description</label>
            <input type="text" class="form-control" id="skill-desc" placeholder="Optional">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <label for="skill-arghint" class="form-label">Argument Hint</label>
            <input type="text" class="form-control" id="skill-arghint" placeholder="e.g. --help">
          </div>
          <div class="col-6">
            <label for="skill-toolgrants" class="form-label">Tool Grants</label>
            <input type="text" class="form-control" id="skill-toolgrants" placeholder='["tool1", "tool2"]'>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="skill-userinvocable">
              <label class="form-check-label" for="skill-userinvocable">User Invocable</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="skill-agentinvocable">
              <label class="form-check-label" for="skill-agentinvocable">Agent Invocable</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="skill-template" class="form-label">Template (Jinja2)</label>
          <textarea class="form-control prompt-template" id="skill-template" rows="12"></textarea>
        </div>
        <div class="mb-3">
          <button type="button" class="btn btn-sm btn-outline-info" id="btn-preview">Preview</button>
          <div id="preview-area" class="mt-2" style="display:none;">
            <div class="preview-output" id="preview-output"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save-skill">Save</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const listEl = document.getElementById('skills-list');
  const modal = new bootstrap.Modal(document.getElementById('skillModal'));
  let skills = [];

  async function loadSkills() {
    const resp = await fetch('/api/skills');
    const data = await resp.json();
    skills = data.skills || [];
    render();
  }

  function render() {
    if (!skills.length) {
      listEl.innerHTML = '<p class="text-body-secondary">No skills.</p>';
      return;
    }

    let html = '<div class="list-group">';
    for (const p of skills) {
      const active = p.active ? '<span class="badge text-bg-success">Active</span>'
                               : '<span class="badge text-bg-secondary">Inactive</span>';
      const isSystem = p.id === 1;
      const desc = p.description ? '<small class="text-body-secondary ms-2">' + escapeHtml(p.description) + '</small>' : '';
      const arghint = p.argument_hint ? '<small class="text-body-secondary ms-2">[' + escapeHtml(p.argument_hint) + ']</small>' : '';
      const userInvocable = p.user_invocable ? '<small class="badge text-bg-info ms-1">User</small>' : '';
      const agentInvocable = p.agent_invocable ? '<small class="badge text-bg-info ms-1">Agent</small>' : '';

      html += '<div class="list-group-item">'
        + '<div class="d-flex justify-content-between align-items-start">'
        + '<div>'
        + '<strong>' + escapeHtml(p.name) + '</strong> '
        + active + desc + arghint + userInvocable + agentInvocable
        + '<div class="mt-1"><small class="text-body-secondary">Updated: ' + (p.updated_at || p.created_at) + '</small></div>'
        + '</div>'
        + '<div class="d-flex gap-2 flex-wrap">'
        + '<button class="btn btn-sm btn-outline-secondary btn-edit" data-id="' + p.id + '">Edit</button>'
        + '<button class="btn btn-sm btn-outline-success btn-toggle-active" data-id="' + p.id + '" data-active="' + p.active + '">'
        + (p.active ? 'Deactivate' : 'Activate')
        + '</button>';

      if (!isSystem) {
        html += '<button class="btn btn-sm btn-outline-danger btn-delete" data-id="' + p.id + '">Delete</button>';
      }

      html += '</div></div></div>';
    }
    html += '</div>';
    listEl.innerHTML = html;

    listEl.querySelectorAll('.btn-edit').forEach(function(el) {
      el.addEventListener('click', function() { editSkill(parseInt(this.dataset.id)); });
    });
    listEl.querySelectorAll('.btn-toggle-active').forEach(function(el) {
      el.addEventListener('click', function() { toggleSkillActive(parseInt(this.dataset.id)); });
    });
    listEl.querySelectorAll('.btn-delete').forEach(function(el) {
      el.addEventListener('click', function() { deleteSkill(parseInt(this.dataset.id)); });
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.getElementById('btn-add-skill').addEventListener('click', function() {
    document.getElementById('skillModalTitle').textContent = 'Add skill';
    document.getElementById('skill-id').value = '';
    document.getElementById('skill-name').value = '';
    document.getElementById('skill-desc').value = '';
    document.getElementById('skill-arghint').value = '';
    document.getElementById('skill-toolgrants').value = '';
    document.getElementById('skill-userinvocable').checked = false;
    document.getElementById('skill-agentinvocable').checked = false;
    document.getElementById('skill-template').value = '';
    document.getElementById('preview-area').style.display = 'none';
    modal.show();
  });

  function editSkill(id) {
    const p = skills.find(function(x) { return x.id === id; });
    if (!p) return;
    document.getElementById('skillModalTitle').textContent = 'Edit skill';
    document.getElementById('skill-id').value = id;
    document.getElementById('skill-name').value = p.name;
    document.getElementById('skill-desc').value = p.description || '';
    document.getElementById('skill-arghint').value = p.argument_hint || '';
    document.getElementById('skill-toolgrants').value = p.tool_grants || '';
    document.getElementById('skill-userinvocable').checked = !!p.user_invocable;
    document.getElementById('skill-agentinvocable').checked = !!p.agent_invocable;
    document.getElementById('skill-template').value = p.template;
    document.getElementById('preview-area').style.display = 'none';
    modal.show();
  }

  document.getElementById('btn-save-skill').addEventListener('click', async function() {
    const id = document.getElementById('skill-id').value;
    const name = document.getElementById('skill-name').value.trim();
    const template = document.getElementById('skill-template').value.trim();
    const description = document.getElementById('skill-desc').value.trim();
    const argument_hint = document.getElementById('skill-arghint').value.trim();
    const tool_grants = document.getElementById('skill-toolgrants').value.trim();
    const user_invocable = document.getElementById('skill-userinvocable').checked;
    const agent_invocable = document.getElementById('skill-agentinvocable').checked;

    if (!name || !template) {
      alert('Name and Template are required');
      return;
    }

    const body = {
      name: name,
      template: template,
      description: description || null,
      argument_hint: argument_hint || null,
      tool_grants: tool_grants || null,
      user_invocable: user_invocable,
      agent_invocable: agent_invocable
    };

    if (id) {
      await fetch('/api/skills/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
    } else {
      await fetch('/api/skills', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
    }

    modal.hide();
    loadSkills();
  });

  document.getElementById('btn-preview').addEventListener('click', async function() {
    const template = document.getElementById('skill-template').value;
    if (!template) return;

    const previewArea = document.getElementById('preview-area');
    const previewOutput = document.getElementById('preview-output');

    try {
      const resp = await fetch('/api/skills/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({template: template})
      });
      const data = await resp.json();
      if (data.error) {
        previewOutput.textContent = 'Error: ' + data.error;
      } else {
        previewOutput.textContent = data.rendered;
      }
      previewArea.style.display = 'block';
    } catch (err) {
      previewOutput.textContent = 'Error: ' + err.message;
      previewArea.style.display = 'block';
    }
  });

  async function toggleSkillActive(id) {
    const resp = await fetch('/api/skills/' + id + '/toggle', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'}
    });
    if (!resp.ok) {
      const data = await resp.json();
      alert(data.error || 'Failed to toggle');
      return;
    }
    loadSkills();
  }

  async function deleteSkill(id) {
    if (!confirm('Delete this skill?')) return;
    const resp = await fetch('/api/skills/' + id, {method: 'DELETE'});
    if (!resp.ok) {
      const data = await resp.json();
      alert(data.error || 'Failed');
      return;
    }
    loadSkills();
  }

  loadSkills();
})();
</script>
{% endblock %}
